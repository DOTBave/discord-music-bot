name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest==9.2.0 ruff==0.17.4
      - name: Byte-compile
        run: python -m compileall -q main.py easter_egg.py tests
      - name: Lint (syntax / undefined names)
        run: ruff check --select E9,F63,F7,F82 main.py easter_egg.py tests
      - name: Test
        run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t music-bot:ci .
      - name: Verify pinned toolchain
        run: |
          docker run --rm music-bot:ci sh -c 'set -e; command -v deno; deno --version; command -v ffmpeg; ffmpeg -version >/dev/null; command -v python; python -V'
      - name: Import smoke test (no secrets)
        run: docker run --rm music-bot:ci python -c "import main; print('import ok')"
