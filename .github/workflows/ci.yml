name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest ruff
      - name: Byte-compile
        run: python -m compileall -q main.py easter_egg.py tests
      - name: Lint (syntax / undefined names)
        run: ruff check --select E9,F63,F7,F82 main.py easter_egg.py tests
      - name: Test
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t music-bot:ci .
      - name: Verify pinned toolchain
        run: |
          docker run --rm music-bot:ci sh -c 'deno --version && ffmpeg -version | head -n1 && python -V'
      - name: Import smoke test (no secrets)
        run: docker run --rm music-bot:ci python -c "import main; print('import ok')"
